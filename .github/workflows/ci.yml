name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Functional tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build output checks (SEO tags, links, sitemap)
        run: npm run test:output

      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
